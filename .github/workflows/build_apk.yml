name: Build Android APK and Windows Portable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Ensure Android Project Files
        run: flutter create . --platforms=android --project-name fish_audio_reader

      # 1. 注入最高文件权限与向下兼容标志
      - name: Inject Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

      # 2. 严谨将 compileSdk 与 targetSdk 固定为 35 (Android 11~15 存储权限硬性要求)
      - name: Fix Android SDK Versions
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          import re
          content = re.sub(r"compileSdk\s*=.*", "compileSdk = 35", content)
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", content)
          content = re.sub(r"targetSdk\s*=.*", "targetSdk = 35", content)
          content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 35", content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '

      # 3. 统一 Kotlin 版本
      - name: Set Kotlin Version
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.1.0"/' android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fish-audio-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_windows_portable:
    name: Build Windows Portable ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Ensure Windows Project Files
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name fish_audio_reader

      - name: Install Dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: flutter build windows --release

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          if (-not (Test-Path $releaseDir)) {
            throw "Windows Release directory not found!"
          }

          $stageDir = "build\portable\FishAudioReader-Portable"
          if (Test-Path $stageDir) { Remove-Item $stageDir -Recurse -Force }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "$releaseDir\*" -Destination $stageDir -Recurse -Force

          # 附带 MSVC 运行库 DLL，避免未装运行库的 Windows 电脑报错缺失 DLL
          $vcDlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($dll in $vcDlls) {
            $src = Join-Path "$env:SystemRoot\System32" $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination $stageDir -Force
            }
          }

          New-Item -ItemType Directory -Path "$stageDir\data\Backup" -Force | Out-Null

          $zipPath = "build\FishAudioReader-Windows-x64-Portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fish-audio-reader-windows-portable
          path: build/FishAudioReader-Windows-x64-Portable.zip
          if-no-files-found: error
