name: YZreader
description: "TXT/EPUB/MD Reader with Fish Audio, Microsoft TTS & Custom Engines (WeRead Style)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  file_picker: ^8.0.7
  just_audio: ^0.9.38
  just_audio_windows: ^0.2.3
  audio_session: ^0.1.19
  archive: ^3.6.1
  fast_gbk: ^1.0.0
  crypto: ^3.0.3
  http: ^1.2.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  scrollable_positioned_list: ^0.3.8
  desktop_drop: ^0.4.4
  open_filex: ^4.4.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
